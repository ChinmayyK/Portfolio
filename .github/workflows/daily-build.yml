# The page and its share image carry the GitHub year as it was at build time, so rebuild and
# deploy once a day to keep them current. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets; without them the job does nothing.
name: Daily build

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
